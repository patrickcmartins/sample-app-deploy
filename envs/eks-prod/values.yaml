# PROD: só muda por PR (workflow "promote"). Canary: dê peso ao "canary" aos poucos.
cluster: eks-prod
environment: prod
image:
  tag: sha-8e73a07
istio:
  host: "*"
podDisruptionBudget:
  enabled: true
versions:
  - name: stable
    weight: 100
    replicas: 2
    color: "#34577c"
    message: "olá do eks-prod"
  # BLUE-GREEN passo 1: green sobe COMPLETO (mesmas réplicas do blue), com 0% do tráfego.
  # Testável por header (x-version: canary) antes de qualquer usuário ver.
  - name: canary
    weight: 0
    replicas: 2
    color: "#2e7d32"
    message: "GREEN no eks-prod"

backend:
  replicas: 2

kafka:
  brokers: events-kafka-bootstrap.kafka:9092

otel:
  enabled: true

monitoring:
  enabled: true
