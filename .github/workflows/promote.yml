# Promoção explícita: copia a tag de um ambiente para outro via PULL REQUEST.
# O merge do PR é o "apply" de prod, com review, histórico e rollback por git revert.
name: promote
on:
  workflow_dispatch:
    inputs:
      from:
        description: ambiente de origem (onde a versão já foi validada)
        type: choice
        options: [eks-stg, kind-dev]
        default: eks-stg
      to:
        description: ambiente de destino
        type: choice
        options: [eks-prod, eks-stg]
        default: eks-prod

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: tag
        env:
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
        run: |
          if [ "$FROM" = "$TO" ]; then echo "::error::origem e destino iguais"; exit 1; fi
          tag=$(yq '.image.tag' "envs/$FROM/values.yaml")
          current=$(yq '.image.tag' "envs/$TO/values.yaml")
          if [ "$tag" = "$current" ]; then echo "::notice::$TO já está em $tag"; exit 1; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          TAG="$tag" yq -i '.image.tag = strenv(TAG)' "envs/$TO/values.yaml"
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: promote/${{ inputs.to }}-${{ steps.tag.outputs.tag }}
          title: "promote(${{ inputs.to }}): sample-app ${{ steps.tag.outputs.tag }}"
          commit-message: "promote(${{ inputs.to }}): sample-app ${{ steps.tag.outputs.tag }}"
          body: |
            Promove `${{ steps.tag.outputs.tag }}` de **${{ inputs.from }}** para **${{ inputs.to }}**.
            Após o merge, o Argo CD sincroniza `sample-app-${{ inputs.to }}`.
