name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: helm lint + template por ambiente
        run: |
          mkdir -p out
          for env in envs/*/; do
            name=$(basename "$env")
            helm lint chart -f "$env/values.yaml"
            helm template sample-app chart -n sample -f "$env/values.yaml" > "out/$name.yaml"
          done
      - name: kubeconform
        run: |
          docker run --rm -v "$PWD/out:/out" ghcr.io/yannh/kubeconform:v0.7.0 -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /out
      # Shift left: as MESMAS regras do webhook de validação do Istio, sem cluster.
      # (Um VirtualService inválido entrou em prod quando o webhook estava fora; o stg recusou.)
      - name: istioctl validate
        run: |
          docker run --rm -v "$PWD/out:/out" istio/istioctl:1.30.8 validate -f /out
